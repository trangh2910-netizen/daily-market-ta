name: Daily Market & TA Podcast

on:
  schedule:
    # 06:00 sáng giờ Việt Nam (UTC+7 -> 23:00 UTC hôm trước) mỗi ngày
    - cron: "0 23 * * *"
    # 18:30 tối giờ Việt Nam (UTC+7 -> 11:30 UTC) Thứ 2 - Thứ 6 sau phiên chứng khoán VN
    - cron: "30 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily briefing pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}
        run: python main.py

      - name: Commit updated docs and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs state.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update daily market briefing & TA podcast"
            git push
          fi
